<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 3 — Voice Authentication</title>

<script src="shared.js"></script>
<script src="supabase.js"></script>
<script src="audioService.js"></script>
<script src="mfccService.js"></script>
<script src="supabaseService.js"></script>
</head>

<body>
<script>injectSharedCSS();</script>

<div class="page">
  <h2>Voice Auth</h2>

  <button id="btn-es">Start Enroll</button>
  <button id="btn-ex">Stop Enroll</button>

  <br><br>

  <button id="btn-vs">Start Verify</button>
  <button id="btn-vx">Stop Verify</button>

  <div id="log"></div>
</div>

<script>
const log = (m) => document.getElementById("log").innerText = m;

const recorderE = createAudioRecorder();
const recorderV = createAudioRecorder();

const sessionId = State?.get?.("sessionId") || crypto.randomUUID();

async function startE(){
  await recorderE.start();
  log("recording enroll...");
}

async function stopE(){
  const pcm = recorderE.stop();
  const mfcc = extractMFCC(pcm);

  await saveMFCCSample({
    sessionId,
    mfcc,
    role:"enroll",
    phrase:"test"
  });

  log("enroll saved");
}

async function startV(){
  await recorderV.start();
  log("recording verify...");
}

async function stopV(){
  const pcm = recorderV.stop();
  const mfcc = extractMFCC(pcm);

  await saveMFCCSample({
    sessionId,
    mfcc,
    role:"verify",
    phrase:"test"
  });

  log("verify saved");
}

document.getElementById("btn-es").onclick = startE;
document.getElementById("btn-ex").onclick = stopE;
document.getElementById("btn-vs").onclick = startV;
document.getElementById("btn-vx").onclick = stopV;
</script>

</body>
</html>
