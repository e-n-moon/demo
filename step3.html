<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 3 — Voice Authentication (Local MFCC)</title>
<script src="shared.js"></script>
</head>
<body>
<script>injectSharedCSS();</script>

<div id="progress-mount"></div>

<div class="page">

  <div class="page-header">
    <div class="page-title">Voice Authentication</div>
    <div class="page-sub">
      Local MFCC-based speaker feature extraction (no cloud inference).
    </div>
  </div>

  <!-- Model -->
  <div class="card">
    <div class="card-title">Model</div>
    <div class="info-box">
      Local DSP pipeline: WAV → MFCC (13 coefficients × frames).  
      Ready for speaker embedding model later.
    </div>
  </div>

  <!-- Enroll -->
  <div class="card">
    <div class="card-title">① Enroll voiceprint</div>

    <div class="phrase" id="enroll-phrase-display">–</div>

    <canvas class="wave" id="e-canvas"></canvas>

    <div class="btn-row">
      <button id="btn-es">🎤 Start recording</button>
      <button id="btn-ex" disabled>⏹ Stop</button>
      <span id="e-rec-status"></span>
    </div>

    <div id="e-status"></div>
    <div id="e-results"></div>
  </div>

  <!-- Verify -->
  <div class="card">
    <div class="card-title">② Verify voiceprint</div>

    <div class="phrase" id="verify-phrase-display"></div>

    <canvas class="wave" id="v-canvas"></canvas>

    <div class="btn-row">
      <button id="btn-vs" disabled>🎤 Start recording</button>
      <button id="btn-vx" disabled>⏹ Stop</button>
      <span id="v-rec-status"></span>
    </div>

    <div id="v-status"></div>
    <div id="v-results"></div>
  </div>

</div>

<div class="footer-nav">
  <button onclick="goTo('step2.html')">← Back</button>
  <span>Step 3 of 4</span>
  <button class="primary" id="btn-next" disabled>Next →</button>
</div>

<script>
document.getElementById('progress-mount').innerHTML = renderProgress(3);

// =========================
// STATE
// =========================
let aStream = {};
let aCtx = {};
let aPcm = {};
let eFeatures = null;
let vFeatures = null;

const ep = State.get('enrollPhrase');
const vp = State.get('verifyPhrase');

if(ep) document.getElementById('enroll-phrase-display').textContent = ep;

// =========================
// AUDIO CAPTURE
// =========================
function startCap(mode){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    aStream[mode] = stream;

    const ctx = new AudioContext({sampleRate:16000});
    aCtx[mode] = ctx;

    const src = ctx.createMediaStreamSource(stream);
    const processor = ctx.createScriptProcessor(512,1,1);

    aPcm[mode] = [];

    processor.onaudioprocess = e=>{
      aPcm[mode].push(
        new Float32Array(e.inputBuffer.getChannelData(0))
      );
    };

    src.connect(processor);
    processor.connect(ctx.destination);

    aCtx[mode]._proc = processor;

    document.getElementById(mode==='e'?'btn-es':'btn-vs').disabled = true;
    document.getElementById(mode==='e'?'btn-ex':'btn-vx').disabled = false;

    document.getElementById(mode==='e'?'e-rec-status':'v-rec-status')
      .textContent = "Recording...";

  }).catch(()=>{
    alert("Microphone permission denied");
  });
}

function stopCap(mode){
  if(aCtx[mode]?._proc){
    aCtx[mode]._proc.disconnect();
  }

  aStream[mode]?.getTracks().forEach(t=>t.stop());

  const chunks = aPcm[mode] || [];
  const pcm = new Float32Array(chunks.reduce((a,b)=>a+b.length,0));

  let offset = 0;
  chunks.forEach(c=>{
    pcm.set(c, offset);
    offset += c.length;
  });

  const features = mfcc(pcm);

  if(mode === 'e'){
    eFeatures = features;
    document.getElementById('e-results').textContent =
      `Enroll MFCC ready: ${features.length} frames`;

    document.getElementById('btn-vs').disabled = false;
  } else {
    vFeatures = features;
    document.getElementById('v-results').textContent =
      `Verify MFCC ready: ${features.length} frames`;

    showMatch();
  }

  document.getElementById(mode==='e'?'btn-es':'btn-vs').disabled = false;
  document.getElementById(mode==='e'?'btn-ex':'btn-vx').disabled = true;
}

// =========================
// MFCC PIPELINE
// =========================
const MFCC = {
  sampleRate: 16000,
  frameSize: 400,
  hopSize: 160,
  melCount: 26,
  mfccCount: 13,
  melFilterBank: null
};

function frameSignal(signal, size, hop){
  const frames = [];
  for(let i=0;i+size<signal.length;i+=hop){
    frames.push(signal.slice(i,i+size));
  }
  return frames;
}

function hamming(n,N){
  return 0.54 - 0.46 * Math.cos((2*Math.PI*n)/(N-1));
}

function fft(signal){
  const N = signal.length;
  if(N <= 1) return signal.map(v=>({re:v,im:0}));

  const even = fft(signal.filter((_,i)=>i%2===0));
  const odd  = fft(signal.filter((_,i)=>i%2===1));

  const out = new Array(N);

  for(let k=0;k<N/2;k++){
    const t = -2*Math.PI*k/N;
    const exp = {re:Math.cos(t), im:Math.sin(t)};

    const o = odd[k];

    const tr = exp.re*o.re - exp.im*o.im;
    const ti = exp.re*o.im + exp.im*o.re;

    out[k] = {
      re: even[k].re + tr,
      im: even[k].im + ti
    };

    out[k+N/2] = {
      re: even[k].re - tr,
      im: even[k].im - ti
    };
  }

  return out;
}

function powerSpectrum(frame){
  const N = frame.length;
  const windowed = frame.map((v,i)=>v*hamming(i,N));

  const fftOut = fft(windowed);

  const power = new Array(N/2);
  for(let i=0;i<N/2;i++){
    const r = fftOut[i].re;
    const im = fftOut[i].im;
    power[i] = r*r + im*im;
  }
  return power;
}

function hzToMel(hz){
  return 2595*Math.log10(1+hz/700);
}

function melToHz(mel){
  return 700*(Math.pow(10,mel/2595)-1);
}

function createMelFilterBank(mels, fftSize, sr){
  const filters = [];

  const melPoints = Array.from({length:mels+2},(_,i)=>
    hzToMel(sr/2*i/(mels+1))
  );

  const hzPoints = melPoints.map(melToHz);

  const bins = hzPoints.map(hz=>
    Math.floor((fftSize+1)*hz/sr)
  );

  for(let m=1;m<=mels;m++){
    const f = new Array(fftSize/2).fill(0);

    for(let i=bins[m-1];i<bins[m];i++){
      f[i] = (i-bins[m-1])/(bins[m]-bins[m-1] || 1);
    }

    for(let i=bins[m];i<bins[m+1];i++){
      f[i] = (bins[m+1]-i)/(bins[m+1]-bins[m] || 1);
    }

    filters.push(f);
  }

  return filters;
}

function mfcc(signal){
  const fftSize = 512;

  const frames = frameSignal(signal, MFCC.frameSize, MFCC.hopSize);

  if(!MFCC.melFilterBank){
    MFCC.melFilterBank = createMelFilterBank(
      MFCC.melCount,
      fftSize,
      MFCC.sampleRate
    );
  }

  const features = [];

  for(const frame of frames){
    const padded = new Float32Array(fftSize);
    padded.set(frame);

    const power = powerSpectrum(padded);

    const melE = MFCC.melFilterBank.map(f=>{
      let sum=0;
      for(let i=0;i<f.length;i++){
        sum += power[i]*f[i];
      }
      return Math.log(sum+1e-10);
    });

    const cep = [];

    for(let k=0;k<MFCC.mfccCount;k++){
      let sum=0;
      for(let n=0;n<melE.length;n++){
        sum += melE[n]*Math.cos(Math.PI*k*(n+0.5)/melE.length);
      }
      cep.push(sum);
    }

    features.push(cep);
  }

  return features;
}

// =========================
// MATCH (simple placeholder)
// =========================
function showMatch(){
  // placeholder: compare feature lengths only
  const diff = Math.abs(eFeatures.length - vFeatures.length);

  const match = diff < 50;

  document.getElementById('v-status').innerHTML =
    match
      ? "✔ Rough match (MFCC baseline)"
      : "✖ Mismatch (expected for different speech)";

  document.getElementById('btn-next').disabled = false;
}

// =========================
// BUTTONS
// =========================
document.getElementById('btn-es').onclick=()=>startCap('e');
document.getElementById('btn-ex').onclick=()=>stopCap('e');
document.getElementById('btn-vs').onclick=()=>startCap('v');
document.getElementById('btn-vx').onclick=()=>stopCap('v');

document.getElementById('btn-next').onclick=()=>goTo('step4.html');
</script>

</body>
</html>
