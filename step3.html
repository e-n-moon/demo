<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 3 — Voice Authentication</title>

<script src="shared.js"></script>

<!-- services (order matters) -->
<script src="supabase.js"></script>
<script src="audioService.js"></script>
<script src="mfccService.js"></script>
<script src="supabaseService.js"></script>
</head>

<body>
<script>injectSharedCSS();</script>

<div id="progress-mount"></div>

<div class="page">

  <div class="page-header">
    <div class="page-title">Voice Authentication</div>
    <div class="page-sub">
      Record enrollment and verification samples for model training
    </div>
  </div>

  <!-- SESSION -->
  <div class="card">
    <div class="card-title">Session</div>
    <div class="mono" id="session-box">–</div>
  </div>

  <!-- ENROLL -->
  <div class="card">
    <div class="card-title">① Enroll phrase</div>

    <div class="phrase" id="enroll-phrase">–</div>

    <div class="btn-row">
      <button id="btn-es">🎤 Start recording</button>
      <button id="btn-ex" disabled>⏹ Stop</button>
      <span id="e-status"></span>
    </div>

    <div id="e-results"></div>
  </div>

  <!-- VERIFY -->
  <div class="card">
    <div class="card-title">② Verify phrase</div>

    <div class="phrase" id="verify-phrase">–</div>

    <div class="btn-row">
      <button id="btn-vs" disabled>🎤 Start recording</button>
      <button id="btn-vx" disabled>⏹ Stop</button>
      <span id="v-status"></span>
    </div>

    <div id="v-results"></div>
  </div>

</div>

<div class="footer-nav">
  <button onclick="goTo('step2.html')">← Back</button>
  <span>Step 3 of 4</span>
  <button id="btn-next" class="primary" disabled>Next →</button>
</div>

<script>
document.getElementById('progress-mount').innerHTML = renderProgress(3);

// ─────────────────────────────
// STATE (MATCH STEP 1 EXACTLY)
// ─────────────────────────────
const sid = State.get('sid');
const enrollPhrase = State.get('enrollPhrase');
const verifyPhrase = State.get('verifyPhrase');

document.getElementById('session-box').textContent =
  sid ? `session: ${sid}` : '❌ missing session';

document.getElementById('enroll-phrase').textContent = enrollPhrase || '–';
document.getElementById('verify-phrase').textContent = verifyPhrase || '–';

// ─────────────────────────────
// DEBUG GUARDS (IMPORTANT)
// ─────────────────────────────
console.log("services check", {
  audio: !!window.createAudioRecorder,
  mfcc: !!window.extractMFCC,
  supabase: !!window.saveMFCCSample
});

// ─────────────────────────────
// AUDIO
// ─────────────────────────────
const recorderE = createAudioRecorder();
const recorderV = createAudioRecorder();

let eMFCC = null;
let vMFCC = null;

// ─────────────────────────────
// ENROLL FLOW
// ─────────────────────────────
async function startEnroll() {
  document.getElementById('e-status').textContent = "Recording...";

  try {
    await recorderE.start();
  } catch (e) {
    console.error(e);
    document.getElementById('e-status').textContent = "Mic error";
    return;
  }

  toggle('btn-es', true);
  toggle('btn-ex', false);
}

async function stopEnroll() {
  document.getElementById('e-status').textContent = "Processing...";

  const pcm = recorderE.stop();

  if (!pcm || !pcm.length) {
    document.getElementById('e-status').textContent = "No audio captured";
    return;
  }

  const mfcc = extractMFCC(pcm);
  eMFCC = mfcc;

  const ok = await saveMFCCSample({
    sessionId: sid,
    role: "enroll",
    mfcc,
    phrase: enrollPhrase
  });

  document.getElementById('e-results').textContent =
    ok ? `Saved enroll (${mfcc.length} frames)` : `Save failed`;

  document.getElementById('e-status').textContent = "Done";

  toggle('btn-es', false);
  toggle('btn-ex', true);
  toggle('btn-vs', false);
}

// ─────────────────────────────
// VERIFY FLOW
// ─────────────────────────────
async function startVerify() {
  document.getElementById('v-status').textContent = "Recording...";

  try {
    await recorderV.start();
  } catch (e) {
    console.error(e);
    document.getElementById('v-status').textContent = "Mic error";
    return;
  }

  toggle('btn-vs', true);
  toggle('btn-vx', false);
}

async function stopVerify() {
  document.getElementById('v-status').textContent = "Processing...";

  const pcm = recorderV.stop();

  if (!pcm || !pcm.length) {
    document.getElementById('v-status').textContent = "No audio captured";
    return;
  }

  const mfcc = extractMFCC(pcm);
  vMFCC = mfcc;

  const ok = await saveMFCCSample({
    sessionId: sid,
    role: "verify",
    mfcc,
    phrase: verifyPhrase
  });

  document.getElementById('v-results').textContent =
    ok ? `Saved verify (${mfcc.length} frames)` : `Save failed`;

  document.getElementById('btn-next').disabled = false;

  toggle('btn-vs', false);
  toggle('btn-vx', true);
}

// ─────────────────────────────
// UI HELPERS
// ─────────────────────────────
function toggle(id, disabled){
  document.getElementById(id).disabled = disabled;
}

// ─────────────────────────────
// BUTTONS
// ─────────────────────────────
document.getElementById('btn-es').onclick = startEnroll;
document.getElementById('btn-ex').onclick = stopEnroll;
document.getElementById('btn-vs').onclick = startVerify;
document.getElementById('btn-vx').onclick = stopVerify;

document.getElementById('btn-next').onclick =
  () => goTo('step4.html');

</script>

</body>
</html>
