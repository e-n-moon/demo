<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 2 — Device Control</title>

<script src="shared.js"></script>
</head>

<body>
<script>injectSharedCSS();</script>

<div id="progress-mount"></div>

<div class="page">

  <div class="page-header">
    <div class="page-title">Device Control</div>
    <div class="page-sub">
      Device binding simulation (WebAuthn-style proof of possession)
    </div>
  </div>

  <!-- SESSION -->
  <div class="card">
    <div class="card-title">Active session</div>
    <div class="mono" id="session-box">–</div>
  </div>

  <!-- DEVICE -->
  <div class="card">
    <div class="card-title">Device binding</div>

    <div class="info-box">
      This simulates a hardware-backed authenticator signing a session nonce.
    </div>

    <div class="row" style="margin-top:12px">
      <div style="flex:1;min-width:220px;background:#13131a;border-radius:10px;padding:12px">
        <div style="font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.05em">
          Device ID
        </div>
        <div class="mono" id="device-id">–</div>
      </div>

      <div style="flex:1;min-width:220px;background:#13131a;border-radius:10px;padding:12px">
        <div style="font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.05em">
          Signature
        </div>
        <div class="mono" id="sig-display">–</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="primary" id="btn-verify" disabled>
        Verify device
      </button>

      <span id="verify-status"></span>
    </div>

    <div id="score-area" style="display:none">
      <div class="sep"></div>
      <div id="score-meters"></div>
    </div>
  </div>

</div>

<div class="footer-nav">
  <button onclick="goTo('step1.html')">← Back</button>
  <span>Step 2 of 4</span>
  <button class="primary" id="btn-next" disabled>Next: Voice →</button>
</div>

<script>
document.getElementById('progress-mount').innerHTML = renderProgress(2);

// ─────────────────────────────
// SESSION CHECK (CRITICAL)
// ─────────────────────────────
const sid = State.get('sid');

if (!sid) {
  document.getElementById('session-box').innerHTML =
    'No session — go back to Step 1';
} else {
  document.getElementById('session-box').textContent =
    `session: ${sid}`;

  document.getElementById('btn-verify').disabled = false;
}

// ─────────────────────────────
// DEVICE FINGERPRINT
// ─────────────────────────────
const fpRaw = [
  navigator.userAgent,
  navigator.language,
  screen.width + 'x' + screen.height,
  navigator.hardwareConcurrency
].join('|');

let hash = 0;
for (let i = 0; i < fpRaw.length; i++) {
  hash = ((hash << 5) - hash) + fpRaw.charCodeAt(i);
  hash |= 0;
}

const deviceId = 'DEV-' + Math.abs(hash).toString(16).padStart(8,'0').toUpperCase();

document.getElementById('device-id').textContent = deviceId;
State.set('deviceId', deviceId);

// ─────────────────────────────
// RESTORE STATE (FIXED)
// ─────────────────────────────
if (State.get('deviceVerified')) {
  showResult(
    State.get('ctrlScore') || 95,
    State.get('sigDisplay') || ''
  );
  document.getElementById('btn-next').disabled = false;
}

// ─────────────────────────────
// VERIFY FLOW
// ─────────────────────────────
document.getElementById('btn-verify').addEventListener('click', async () => {
  const btn = document.getElementById('btn-verify');

  btn.disabled = true;
  document.getElementById('verify-status').innerHTML =
    '<span class="badge badge-info">Signing nonce...</span>';

  await new Promise(r => setTimeout(r, 400 + Math.random() * 400));

  const nonce = State.get('nonce');

  let sig = '';
  for (let i = 0; i < nonce.length; i++) {
    sig += (nonce.charCodeAt(i) ^ (i * 17)).toString(16).padStart(2,'0');
  }

  const sigShort = sig.slice(0, 24).toUpperCase();

  const score = 88 + Math.floor(Math.random() * 12);

  // ── IMPORTANT: SINGLE SOURCE OF TRUTH ──
  State.set('ctrlScore', score);
  State.set('sigDisplay', sigShort);
  State.set('deviceVerified', true);

  document.getElementById('sig-display').textContent = sigShort + '…';

  showResult(score, sigShort);

  document.getElementById('btn-next').disabled = false;
});

// ─────────────────────────────
// RESULT UI
// ─────────────────────────────
function showResult(score, sig) {
  document.getElementById('verify-status').innerHTML =
    '<span class="badge badge-ok">✓ Device verified</span>';

  document.getElementById('score-area').style.display = 'block';

  document.getElementById('score-meters').innerHTML =
    meterHTML('Device binding score', score) +
    meterHTML('Nonce signature valid', 100, '#1d9e75') +
    meterHTML('Session freshness', 97, '#1d9e75');
}

document.getElementById('btn-next').onclick =
  () => goTo('step3.html');
</script>

</body>
</html>
